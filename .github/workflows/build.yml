name: Compilar Mod Voidborn

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Descompactar e Localizar Projeto
        run: |
          unzip -o *.zip
          BUILD_PATH=$(find . -name "build.gradle" -not -path "*/.github/*" | head -n 1)
          if [ -n "$BUILD_PATH" ]; then
            PROJECT_DIR=$(dirname "$BUILD_PATH")
            if [ "$PROJECT_DIR" != "." ]; then
              cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
            fi
          fi

      - name: Gerar Executavel e Compilar
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Enviar arquivo .jar pronto
        uses: actions/upload-artifact@v4
        with:
          name: Voidborn-Mod-JAR
          path: "**/build/libs/*.jar"
