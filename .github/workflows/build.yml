name: Compilar Mod Voidborn

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Descompactar e Localizar Projeto
        run: |
          mkdir -p temp_unzip
          unzip -o *.zip -d temp_unzip/
          BUILD_PATH=$(find temp_unzip -name "build.gradle" | head -n 1)
          if [ -n "$BUILD_PATH" ]; then
            PROJECT_DIR=$(dirname "$BUILD_PATH")
            cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
          fi
          rm -rf temp_unzip

      - name: Gerar Executavel e Compilar
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew build -x test --no-daemon

      - name: Enviar arquivo .jar pronto
        uses: actions/upload-artifact@v4
        with:
          name: Voidborn-Mod-JAR
          path: "**/build/libs/*.jar"
